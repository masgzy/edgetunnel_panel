# ============================================================
# edt_panel 配置模板
# 首次启动时若 config.yml 不存在，会自动用本文件初始化并退出，
# 请编辑 config.yml 后重新启动。
#
# 原则：只保留开箱即用的最小配置；可选功能均以注释给出，
#       需要时去掉注释自行打开。所有注释均可删除。
# ============================================================

# ---- 运行参数 ----
app:
  host: 0.0.0.0     # 监听地址；0.0.0.0 表示监听所有网卡
  port: 5001        # 面板控制端口（Web UI / API / 实时日志共用）
  debug: false      # 调试模式：输出更详细的日志

# ---- 远程控制端 ----
# 对接 EDT-Pages / BPB 型管理面板（Worker）。
remote:
  # 控制端域名（base）。以下两个地址默认由它自动拼接：
  #   admin_url = https://<control_domain>/admin/config.json  拉取 UUID 与 CF 用量
  #   auth.login_url = https://<control_domain>/login         POST password 换 auth Cookie
  # 仅当控制端路径非默认时才需要显式覆盖（见下方注释示例）。
  control_domain: example.com
  # admin_url: https://example.com/admin/config.json
  request_timeout: 15        # 访问控制端的超时（秒）
  subscription_port: 8443    # 订阅对外端口：写入节点的 port 字段（Worker 监听端口）

# ---- 鉴权与订阅头 ----
auth:
  # login_url 可省略：默认 https://<control_domain>/login
  # login_url: https://example.com/login
  login_password: CHANGE_ME  # 面板登录口令（Web UI / API）；也可用环境变量 EDT_LOGIN_PASSWORD
  # 客户端订阅页显示的「套餐到期」时间；可省略（默认 2030-01-01）。
  # userinfo_expire: "2030-01-01 00:00:00+08:00"

# ---- 文件路径（相对运行目录，一般无需改动） ----
files:
  vless_file: data/vless.txt                  # 主节点配置：面板「节点配置」页读写的数据文件
  result_file: data/result.csv                # 优选结果：「优选 IP」页测速产出
  run_time_file: data/run_time.txt            # UUID 日期轮换记录（自动维护）
  auth_cache_file: data/auth.txt              # 控制端登录 Cookie 缓存（自动维护）

# 说明：mihomo(clash.meta) 订阅由面板内置生成（/mihomo 与 /sub?clash 均可直接使用），
# 无需任何外部模板文件。如需切换规则模板，可给订阅地址追加 ?config=<ACL4SSR ini URL>。

# ---- 变量 ----
# 可在 vless.txt 等数据文件中引用，支持三种写法：NRT、{{NRT}}、${NRT}。
# 内置变量 NRT（日本优选池）无需配置即可使用；以下均为自定义示例：
# variables:
#   NRT:                    # 覆盖内置 NRT：改为从文件读取（每行一个 IP/域名）
#     type: file
#     path: data/NRT.txt
#   MY_PROXY:               # 自定义变量：直接内联固定内容
#     type: inline
#     content: 198.51.100.10

# ---- 订阅模板 ----
subscriptions:
  default_profile: main_edt   # 请求不带 type 时使用的模板
  encode_base64: true         # /sub 输出是否整体 Base64（v2rayN 等客户端需要 true）
  # defaults_by_id:           # 可选：按订阅 ID 指定默认模板（覆盖 default_profile）
  #   "2": public_snippets
  #   "3": public_snippets
  profiles:
    main_edt:
      name: Main edt_panel        # 模板名称（生成页展示用）
      aliases: [edt, main]        # 别名：/sub?type=别名 同样可命中
      format: edt                 # edt = 动态 UUID 对接面板 | snippets = 固定 UUID 快照
      domain: sub.example.com     # 节点 SNI/Host（Worker 绑定域名）
      uuid_mode: dynamic          # dynamic = 面板每日轮换 | static = 使用下方固定 uuid
    # 更多模板示例（用到时再打开）：
    # public_snippets:
    #   name: Public Snippets
    #   aliases: [snippet, snippets]
    #   format: snippets
    #   domain: snippets.example.com
    #   uuid_mode: static
    #   uuid: 00000000-0000-0000-0000-000000000000

# ---- 数据源 ----
# 订阅 ID -> 数据源。ID 与 vless.txt 分节/生成页的数据源选择对应。
data_sources:
  by_id:
    "1":
      name: 主配置（vless.txt）
      kind: vless_file            # vless_file = 文本节点配置
      path: data/vless.txt
    "3":
      name: 优选结果（result.csv）
      kind: preferred_result      # preferred_result = 按「优选 IP」页的 pre_ip 与 result.csv 动态生成，无需 path
    # "2"（可选）：自定义 ProxyIP 池。需要时把 JSON 数组写到
    # data/custom_proxies.json（格式同 data_sources 的节点列表），再打开本节：
    # "2":
    #   name: 自定义 ProxyIP 池
    #   kind: json_file
    #   path: data/custom_proxies.json

# ---- subconverter 桥接（可选） ----
# 面板原生支持 vless / mihomo(clash.meta) 订阅；仅当需要 clashr / surge /
# quanx 等异构格式时才开启本节。
subconverter:
  mode: off                    # off = 禁用 | local = 本地二进制 | remote = 远程地址
  # bin: bin/subconverter/subconverter   # local 模式：二进制路径（可在设置页下载安装）
  # port: 25500                          # local 模式：监听端口
  # remote: https://api.v1.mk            # remote 模式：远程转换后端地址

# ---- 生成配置（可选） ----
# 订阅链接的协议与连接参数来源。
# auto_from_panel: 默认开启「自动获取配置(协议，设置)」——优从面板 config.json
#   读取同名设置（协议类型/传输协议/跳过证书验证/启用0RTT/TLS分片/随机路径/
#   反代路径/ECH/Fingerprint…），拉取失败回落 manual（或内置缺省）。
gen:
  auto_from_panel: true
  # aggregate_worker_sub: true   # 聚合面板(Worker) /sub 原生订阅到输出（含优选 IP 池与反代注入）
  # manual:                      # 取消自动后的手动默认值；全部可省略（省略即内置缺省）
  #   protocol: vless            # vless | trojan | ss
  #   transport: ws              # ws | xhttp | grpc
  #   grpc_mode: gun             # gun | multi（transport=grpc 时生效）
  #   grpc_user_agent: ""        # gRPC user-agent 元数据（可空）
  #   skip_cert_verify: false    # 跳过证书验证 → allowInsecure=1
  #   enable_0rtt: true          # 启用 0-RTT → 路径追加 ed=2560
  #   fragment: ""               # TLS 分片："" | shadowrocket | happ
  #   random_path: false         # 随机伪装路径前缀
  #   ech: false                 # ECH（需配合面板 Worker 开启 ECH 支持）
  #   ech_dns: ""
  #   ech_sni: ""
  #   fingerprint: chrome        # chrome|firefox|safari|ios|android|edge|360|qq|random|randomized
  #   ss_cipher: aes-128-gcm     # SS 加密方式（自动模式读取面板 SS.加密方式）
  #   ss_tls: true               # SS TLS（false 时端口映射为 noTLS 组：443→80 等）
