# Release：推送 vX.Y.Z tag 时自动交叉编译并发布 GitHub Release
#
# 版本核验说明（2026-08-27 实测，GitHub API + releases/latest 跳转双通道，
# 并逐个阅读对应 tag 的 raw README 后选定当前最新发布版）：
#   - actions/checkout@v7            （v7.0.1）
#   - actions/setup-go@v7            （v7.0.0）
#   - actions/upload-artifact@v7     （v7.0.1）
#   - actions/download-artifact@v8   （v8.0.1）
#   - softprops/action-gh-release@v3 （v3.0.2）
#
# 产物命名 edt_panel_<os>_<arch>[_<arm|gomips>].tar.gz|zip：
#   android_arm64/arm        # Android 5+ 终端（Termux/adb）。NDK+CGO 构建：bionic 的
#                            # getaddrinfo 才能走系统 DNS——纯静态 CGO=0 构建在 Android 上
#                            # 读不到 /etc/resolv.conf 会 DNS 解析失败（Android 5+ 实测）
#   darwin_amd64/arm64       # macOS Intel / Apple Silicon
#   linux_386/amd64/arm64    # Linux x86 32位 / 64位 / ARM64
#   linux_armv5/armv6/armv7  # Linux ARM 各代（GOARM）
#   linux_mips(64)(le)       # 路由器等环境，mips/mipsle 固定 GOMIPS=softfloat（软浮点兼容面最广）
#   windows_386/amd64/arm64  # Windows（zip 包，内含 edt_panel.exe）
#
# 归档内含：edt_panel(.exe) + config.example.yml + install_subconverter.sh + README.md
#           （mihomo 订阅已内置生成，v1.3.0 起不再随包分发模板示例）

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: android_arm64, goos: android, goarch: arm64, cc: aarch64-linux-android21-clang }
          - { id: android_arm,   goos: android, goarch: arm,  goarm: "7", cc: armv7a-linux-androideabi21-clang }
          - { id: darwin_amd64,   goos: darwin,  goarch: amd64 }
          - { id: darwin_arm64,   goos: darwin,  goarch: arm64 }
          - { id: linux_386,      goos: linux,   goarch: "386" }
          - { id: linux_amd64,    goos: linux,   goarch: amd64 }
          - { id: linux_arm64,    goos: linux,   goarch: arm64 }
          - { id: linux_armv5,    goos: linux,   goarch: arm, goarm: "5" }
          - { id: linux_armv6,    goos: linux,   goarch: arm, goarm: "6" }
          - { id: linux_armv7,    goos: linux,   goarch: arm, goarm: "7" }
          - { id: linux_mips,     goos: linux,   goarch: mips,     gomips: softfloat }
          - { id: linux_mips64,   goos: linux,   goarch: mips64 }
          - { id: linux_mips64le, goos: linux,   goarch: mips64le }
          - { id: linux_mipsle,   goos: linux,   goarch: mipsle,   gomips: softfloat }
          - { id: windows_386,    goos: windows, goarch: "386" }
          - { id: windows_amd64,  goos: windows, goarch: amd64 }
          - { id: windows_arm64,  goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      GOMIPS: ${{ matrix.gomips }}
    steps:
      - uses: actions/checkout@v7

      # 发布固定使用最新稳定版 Go 工具链（最低兼容性已由 CI 以 go.mod 底线常驻验证）
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: go.sum

      # Android 目标需 NDK 工具链（cgo resolver 走 bionic getaddrinfo，
      # 解决纯静态构建在 Android 上 DNS 解析失败；其余平台跳过此步）。
      # 直下官方 zip + actions/cache（setup-ndk 的版本清单不含 r27c，弃用）
      - name: Cache Android NDK
        if: matrix.goos == 'android'
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/ndk
          key: android-ndk-r27c-linux-x86_64

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/ndk/android-ndk-r27c" ]; then
            mkdir -p "$HOME/ndk"
            curl -fsSL --retry 3 -o /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
            unzip -q /tmp/ndk.zip -d "$HOME/ndk"
            rm -f /tmp/ndk.zip
          fi
          echo "NDK_ROOT=$HOME/ndk/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Build and stage
        shell: bash
        env:
          NDK_ROOT: ${{ env.NDK_ROOT }}
        run: |
          set -euo pipefail
          EXT=''
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT='.exe'; fi
          if [ "${{ matrix.goos }}" = "android" ]; then
            # GOOS=android + cgo：DNS 走 bionic resolver；API 21 = Android 5.0+；
            # 产物默认 PIE（Android 5+ 仅允许 PIE）
            export CGO_ENABLED=1
            export CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
          fi
          mkdir -p "package/${{ matrix.id }}"
          cp README.md config.example.yml install_subconverter.sh "package/${{ matrix.id }}/"
          go build -trimpath -ldflags='-s -w' -o "package/${{ matrix.id }}/edt_panel${EXT}" .
          chmod 755 "package/${{ matrix.id }}/edt_panel${EXT}" \
                    "package/${{ matrix.id }}/install_subconverter.sh"

      # actions/upload-artifact v7：if-no-files-found 必须显式报错
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.id }}
          path: package/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release v3 要求的最小权限
    steps:
      # actions/download-artifact v8：不带 merge-multiple，各平台解到
      # dist/dist-<id>/ 独立子目录——若开启 merge-multiple 会把所有平台的
      # 同名二进制平铺合流互相覆盖（v1.0.0 首跑踩坑），必须保持分目录
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist

      - name: Package archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for dir in dist-*/; do
            d="${dir#dist-}"; d="${d%/}"
            chmod 755 "${dir}"/edt_panel* "${dir}"/install_subconverter.sh
            case "$d" in
              windows_*) (cd "$dir" && zip -q -r -X -9 "../edt_panel_${d}.zip" *) ;;
              *)         (cd "$dir" && tar --owner=0 --group=0 --mtime='@0' \
                                  -czf "../edt_panel_${d}.tar.gz" *) ;;
            esac
          done
          rm -rf -- dist-*/
          rm -f checksums.txt   # 防止重跑时把自身算进校验清单
          sha256sum * > checksums.txt
          ls -la

      # softprops/action-gh-release v3：tag 含 '-'（如 v1.2.3-rc1）自动标记为预发布
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
