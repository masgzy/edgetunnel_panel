# CI：push / PR 到任意分支时触发
# - 按 go.mod 声明的兼容底线工具链（Go 1.21.x）编译，保证最低版本可用
# - 三平台冒烟（ubuntu / macos / windows），gofmt / vet / test / build
# - 单测：Linux 以 -race 跑（并发问题回归防线）；Windows 跑普通 go test；
#   macOS 暂跳过（1.21 基线工具链与新版 runner dyld 的 LC_UUID 兼容问题，见 Test 步骤注释）
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # actions/checkout v7.0.1（2026-08 经 GitHub API + releases/latest 双通道核验）
      - uses: actions/checkout@v7

      # actions/setup-go v7.0.0（同上核验）；无 toolchain 指令时按 go.mod 的 go 指令取版本，
      # 即用最低兼容工具链 1.21.x 编译 = 常驻底线回归
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::以下文件需要 gofmt:$out"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # 数据竞争防线：service 层并发保护（配置热重载 / 锁内快照）依赖 -race 防回归。
      # race 检测器依赖 cgo，Linux runner 自带 gcc 且速度最快，故仅在 Linux 启用；
      # 其余平台跑普通 go test，保证跨平台编译与断言。
      - name: Test (race)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Test
        # macOS 暂不跑 go test：1.21 基线工具链的链接器在新版 macOS runner 的
        # dyld 上可能产出缺 LC_UUID 的测试二进制而被拒载（上游 Go 已在新版修复，
        # 1.21 已 EOL 不会回移）。基线编译兼容仍由 vet + build 验证；
        # 测试防线由 Linux（-race）与 Windows 承担。
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

      - name: Build (linux/macos)
        if: runner.os != 'Windows'
        run: go build -trimpath -o edt_panel-check .

      - name: Build (windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -o edt_panel-check.exe .
